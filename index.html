<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>权属字段清单</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--bd:#e3e6ec;--tx:#1f2328;--sub:#6b7280;--hd:#1f4e79;--acc:#2563eb;--chip:#eef2ff;}
[data-theme="dark"]{--bg:#16181d;--card:#1f2329;--bd:#31363f;--tx:#e6e8eb;--sub:#9aa3ad;--hd:#2c5f8f;--acc:#7aa2f7;--chip:#243044;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"Microsoft YaHei",sans-serif;padding:16px}
.wrap{max-width:1200px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:20px}
.meta{color:var(--sub);font-size:12px;margin-top:4px}
button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
button:hover{border-color:var(--acc);color:var(--acc)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:6px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:13px}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--hd);color:#fff;text-align:left;padding:9px 10px;font-weight:600;position:sticky;top:0;font-size:12px}
td{padding:8px 10px;border-top:1px solid var(--bd);vertical-align:top}
tr:nth-child(even) td{background:rgba(128,128,128,.045)}
.scroll{max-height:70vh;overflow:auto}
.badge{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;background:var(--chip);color:var(--acc);white-space:nowrap}
.badge.must{background:#fde8e8;color:#c0392b}
.badge.cond{background:#fff4e0;color:#b26a00}
.badge.opt{background:#eef0f2;color:#6b7280}
code{background:rgba(128,128,128,.12);padding:1px 5px;border-radius:4px;font-size:12px}
.hide{display:none}
footer{color:var(--sub);font-size:12px;text-align:center;margin:18px 0 6px}
@media(max-width:640px){table{font-size:12px}th,td{padding:6px 7px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>权属字段清单</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div style="display:flex;gap:8px">
    <button id="theme">切换主题</button>
    <button id="csv">导出 CSV</button>
  </div>
</header>
<div class="tabs" id="tabs"></div>
<div class="tools">
  <input type="search" id="q" placeholder="搜索字段名 / 代码 / 说明…">
  <button id="must">只看必填</button>
</div>
<div class="card scroll"><table id="tb"><thead id="th"></thead><tbody id="tbody"></tbody></table></div>
<footer>字段口径：不动产登记 / 地籍调查。地方登记机构有细化规定的，从其规定。</footer>
</div>

  const p=PAGES.find(x=>x.k===cur);
  $('th').innerHTML='<tr>'+p.cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>';
  let rows=DATA[p.k].filter(r=>{
    const hit=!kw||p.raw(r).join(' ').toLowerCase().includes(kw.toLowerCase());
    const m=!onlyMust||String(p.req(r)).indexOf('必填')===0;
    return hit&&m;
  });
  $('tbody').innerHTML=rows.map(r=>'<tr>'+p.row(r).map((c,i)=>{
    let v=c==null||c===''?'—':String(c);
    if(p.k==='fields'&&i===6){
      const cls=v==='必填'?'must':(v==='条件必填'?'cond':'opt');
      v='<span class="badge '+cls+'">'+v+'</span>';
    }
    if(p.k==='rules'&&i===4){v='<span class="badge '+(v==='阻断'?'must':'cond')+'">'+v+'</span>';}
    if(i===3&&p.k==='fields') v='<code>'+v+'</code>';
    return '<td>'+v+'</td>';
  }).join('')+'</tr>').join('')||'<tr><td colspan="'+p.cols.length+'" style="text-align:center;color:var(--sub)">没有匹配的记录</td></tr>';
}
$('tabs').innerHTML=PAGES.map(p=>'<div class="tab" data-k="'+p.k+'">'+p.n+'（'+DATA[p.k].length+'）</div>').join('');
$('tabs').onclick=e=>{const t=e.target.closest('.tab');if(!t)return;cur=t.dataset.k;
  [...document.querySelectorAll('.tab')].forEach(x=>x.classList.toggle('on',x===t));render();};
document.querySelector('.tab').classList.add('on');
$('q').oninput=e=>{kw=e.target.value.trim();render();};
$('must').onclick=()=>{onlyMust=!onlyMust;$('must').style.borderColor=onlyMust?'var(--acc)':'var(--bd)';render();};
const LS={g:()=>{try{return localStorage.getItem('t')}catch(e){return null}},
          s:v=>{try{localStorage.setItem('t',v)}catch(e){}}};
$('theme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=d;LS.s(d);};
document.documentElement.dataset.theme=LS.g()||'light';
$('csv').onclick=()=>{const p=PAGES.find(x=>x.k===cur);
  const rows=DATA[p.k].filter(r=>!kw||p.raw(r).join(' ').toLowerCase().includes(kw.toLowerCase()));
  const esc=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv='\ufeff'+[p.cols.map(esc).join(',')].concat(rows.map(r=>p.raw(r).map(esc).join(','))).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='权属字段清单-'+p.n+'.csv';a.click();};
const f=DATA.fields;
$('meta').innerHTML='共 '+f.length+' 个字段 · 必填 '+f.filter(x=>x.req==='必填').length
  +' · 条件必填 '+f.filter(x=>x.req==='条件必填').length
  +' · 选填 '+f.filter(x=>x.req==='选填').length
  +' · 值域 '+DATA.dicts.length+' 项 · 质检规则 '+DATA.rules.length+' 条';
render();
</script>
</body>
</html>
